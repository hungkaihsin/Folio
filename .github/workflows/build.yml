name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run package:mac -- --publish never
            artifact: pageline-macos-universal
          - os: windows-latest
            command: npm run package:win -- --publish never
            artifact: pageline-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run test:desktop
      - run: npm run test:clipboard
      - run: npm run test:print-desktop
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Fetch checksum-verified 0.8.0 upgrade baseline
        run: node scripts/fetch-upgrade-baseline.mjs
      - if: runner.os == 'macOS'
        run: npm run test:installer:mac
      - if: runner.os == 'Windows'
        run: node tests/windows-package.mjs
      - if: runner.os == 'Windows'
        run: npm run test:installer:win
        env:
          FOLIO_INSTALLER_TEST: '1'
      - name: Record checksums of the tested installer bytes
        run: node scripts/release-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/**/*.dmg
            release/**/*-Setup.exe
            release/**/*-SHA256SUMS-*.txt
